[project]
name = "hijackscan"
version = "0.1.0"
description = "Exposure of a namespace to certificate theft through BGP hijacks below DNS"
readme = "README.md"
authors = [
    { name = "mladicstefan", email = "stefan@mladicstefan.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.9.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "publicsuffix2>=2.20191221",
    "pymongo>=4.19.0",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
hijackscan = "hijackscan:main"
demo = "hijackscan.demo:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyyaml>=6",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/hijackscan/report/*" = ["E501"]   # prose for the reports
